name: Build FydelisTech OS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo-fonte
        uses: actions/checkout@v4

      - name: Verificar estrutura de pastas e includes
        run: |
          pwd
          ls -la
          ls -la include/syscalls/ || ls -la src/include/syscalls/ || true

      - name: Instalar toolchain (NASM, GCC, Python Pillow, CairoSVG, genisoimage)
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc binutils make python3 python3-pil python3-cairosvg genisoimage

      - name: Compilar Kernel, Gravar Wallpapers e Gerar ISO
        run: |
          make -C kernel clean
          make -C kernel all

      - name: Publicar artefatos (fydelterm.img e fydelterm.iso)
        uses: actions/upload-artifact@v4
        with:
          name: FydelisTechOS-build
          path: |
            kernel/fydelterm.img
            kernel/fydelterm.iso
            kernel/kernel.bin

      - name: Criar Release Publica (ao enviar tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kernel/fydelterm.img
            kernel/fydelterm.iso
