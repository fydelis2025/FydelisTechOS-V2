name: Compilar e Publicar FydelisTech OS

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar toolchain (NASM, GCC, Python, Genisoimage)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm python3 python3-pil python3-cairosvg genisoimage xorriso grub-pc-bin grub-common mtools

      - name: Compilar Kernel e ISO em kernel/
        working-directory: kernel
        run: |
          make clean
          make

      - name: Publicar ISO e IMG na Release do GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('FydelisTech OS {0}', github.ref_name) || 'FydelisTech OS (Build Automatico)' }}
          body: |
            Compilacao automatica gerada pelo GitHub Actions a partir do commit `${{ github.sha }}`.
            Baixe `fydelterm.iso` ou `fydelterm.img` abaixo para testar no QEMU ou gravar em pendrive.
          files: |
            kernel/fydelterm.iso
            kernel/fydelterm.img
            kernel/kernel.bin
          fail_on_unmatched_files: false
