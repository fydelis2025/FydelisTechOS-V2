name: Compilar e Publicar FydelisTech OS

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # Necessario para o GitHub Actions criar/atualizar Releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar toolchain (NASM, GCC, Python, GRUB/Xorriso)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm python3 python3-pil python3-cairosvg xorriso grub-pc-bin grub-common mtools

      - name: Compilar Kernel em kernel/makefile
        working-directory: kernel
        run: |
          if grep -q "assets:" makefile; then
            make -f makefile assets
          fi
          make -f makefile clean
          make -f makefile

      - name: Verificar arquivos gerados
        run: |
          ls -lh **/*.iso **/*.bin **/*.elf 2>/dev/null || true

      - name: Publicar ISO na Release do GitHub
        uses: softprops/action-gh-release@v2
        with:
          # Se o gatilho for uma tag (ex: v4.2), usa o nome da tag; senao atualiza a release "latest-build"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('FydelisTech OS {0}', github.ref_name) || 'FydelisTech OS (Build Automatico)' }}
          body: |
            Compilacao automatica gerada pelo GitHub Actions a partir do commit `${{ github.sha }}`.
            Baixe a imagem `.iso` abaixo para testar no QEMU ou gravar em pendrive.
          files: |
            **/*.iso
            **/*.bin
          fail_on_unmatched_files: false
