name: Compilar e Publicar FydelisTech OS

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar toolchain (NASM, GCC, Python, QEMU, Genisoimage)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm python3 python3-pil python3-cairosvg genisoimage xorriso grub-pc-bin grub-common mtools qemu-system-x86

      - name: Compilar Kernel, Diagnosticar 0x8722 e Testar Boot
        working-directory: kernel
        run: |
          make clean
          make
          make iso
          ls -lh *.iso *.img *.bin
          echo "=== DISASSEMBLY AO REDOR DE 0x8722 ==="
          ndisasm -b 64 -o 0x8000 kernel.bin | grep -B 12 -A 6 "8722" || true
          echo "=== TESTE RAPIDO NO QEMU (fydelterm.img) ==="
          timeout 5s qemu-system-x86_64 -drive format=raw,file=fydelterm.img -boot c -m 512M -display none -no-reboot -d int,cpu_reset 2>&1 | tail -n 35 || true

      - name: Anexar ISO e IMG nos Artifacts da Action
        uses: actions/upload-artifact@v4
        with:
          name: FydelisTechOS-ISO
          path: |
            kernel/fydelterm.iso
            kernel/fydelterm.img
            kernel/kernel.bin

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('FydelisTech OS {0}', github.ref_name) || 'FydelisTech OS (Build Automatico)' }}
          files: |
            kernel/fydelterm.iso
            kernel/fydelterm.img
            kernel/kernel.bin
          fail_on_unmatched_files: true
