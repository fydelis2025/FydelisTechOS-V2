name: Compilar FydelisTech OS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar toolchain (NASM, GCC, Python, GRUB/Xorriso)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm python3 python3-pil python3-cairosvg xorriso grub-pc-bin grub-common mtools

      - name: Compilar Kernel em kernel/makefile
        working-directory: kernel
        run: |
          if grep -q "assets:" makefile; then
            make -f makefile assets
          fi
          make -f makefile clean
          make -f makefile

      - name: Publicar ISO / Binario compilado para download
        uses: actions/upload-artifact@v4
        with:
          name: FydelisTechOS-build
          path: |
            **/*.iso
            **/*.bin
            **/*.elf
          if-no-files-found: warn
